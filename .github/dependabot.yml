# Weekly dependency updates. Actions in .github/workflows/ are pinned to full commit
# SHAs with a version comment; Dependabot keeps that form, bumping the SHA and the comment.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
