name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Note: GitHub Actions and the Bun runtime version are pinned below;
    # GitHub-hosted runner OS images (ubuntu-latest, macos-latest) remain rolling host images.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pinned Bun runtime
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.5"

      - name: Install devDependencies (typecheck only)
        run: bun install --frozen-lockfile

      - name: Shell syntax check
        run: bash -n bin/sync-agents install.sh

      - name: TypeScript typecheck
        run: bun run typecheck

      - name: Build standalone binary
        run: bun run build:bin

      - name: Smoke-run standalone binary
        run: ./dist/sync-agents --help

      # Includes test/binary.test.ts, which rebuilds dist/sync-agents with build:bin and
      # runs the integration slice against it. CI=true makes that suite fail rather than
      # skip if bun build --compile is unavailable.
      # Nonexistent XDG values make any test that falls back to the runner's real environment
      # (instead of its sandbox) fail here rather than silently touch the runner's home.
      - name: Run native Bun test suite
        env:
          XDG_CONFIG_HOME: /nonexistent/xdg-config
          XDG_STATE_HOME: /nonexistent/xdg-state
        run: bun test
